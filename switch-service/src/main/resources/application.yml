server:
  port: ${PORT:8083}

spring:
  application:
    name: switch-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/switch}
    username: ${DB_USER:payswitch}
    password: ${DB_PASSWORD:payswitch}
  flyway:
    locations: classpath:db/switch/migration

switch:
  # Every call to a bank gives up after these limits instead of waiting forever.
  http:
    connect-timeout: 2s   # max time to open the connection
    read-timeout: 5s      # max time to wait for the bank's answer
  # VPA routing: the handle after the @ decides the bank.
  #   ravi@banka -> handle "banka" -> Bank A
  banks:
    banka:
      code: BANKA
      url: ${BANKA_URL:http://localhost:8081}
    bankb:
      code: BANKB
      url: ${BANKB_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
