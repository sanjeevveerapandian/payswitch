server:
  port: ${PORT:8083}

spring:
  application:
    name: switch-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/switch}
    username: ${DB_USER:payswitch}
    password: ${DB_PASSWORD:payswitch}
  flyway:
    locations: classpath:db/switch/migration
  jackson:
    deserialization:
      # Amounts are whole paise. By default Jackson turns 20000.9 into 20000 without a word.
      # Off: a decimal amount is a 400, never a quietly different amount of money.
      accept-float-as-int: false

switch:
  # Every call to a bank gives up after these limits instead of waiting forever.
  http:
    connect-timeout: 2s   # max time to open the connection
    read-timeout: 5s      # max time to wait for the bank's answer
  # Retrying status checks and reversals: wait 1s, 2s, 4s (each +-20%) between 4 attempts.
  retry:
    base-delay: 1s
    multiplier: 2.0
    jitter: 0.2
    max-attempts: 4
  # Finding out what really happened when a bank's answer was UNKNOWN.
  resolution:
    enabled: true
    inline-wait: 3s       # POST /pay waits this long for resolution, then answers PENDING
    stuck-after: 30s      # the background job leaves payments alone for this long
    interval: 15s         # how often the background job runs
    batch-size: 10        # stuck payments claimed per batch
    lease: 60s            # a claimed payment is off limits to other resolvers for this long
    run-on-startup: true  # crash recovery
    deemed-recheck-after: 5m   # DEEMED_APPROVED payments are checked again this often
  # Reconciliation: compare the switch's books with the banks' books, window by window.
  recon:
    enabled: true
    cutoff: 5m            # leave payments younger than this alone: they may still be in flight
    interval: 10m         # the job reconciles one 10-minute window every 10 minutes
    bank-clock-slack: 5m  # read bank entries this much beyond the window on both sides
    page-size: 500        # /recon/entries page size
    run-lease: 30m        # a crashed run's window can be taken over after this
  # Settlement: every interval, close the open cycle and settle it (net positions, central bank, advice).
  settlement:
    enabled: true
    interval: 1h
  # VPA routing: the handle after the @ decides the bank.
  #   ravi@banka -> handle "banka" -> Bank A
  banks:
    banka:
      code: BANKA
      url: ${BANKA_URL:http://localhost:8081}
    bankb:
      code: BANKB
      url: ${BANKB_URL:http://localhost:8082}
    bankc:
      code: BANKC
      url: ${BANKC_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health
