# Security headers for every response nginx sends (included by nginx.conf; see the note there on
# why it is a separate file). "always" adds them to error responses too.

# Do not guess a file's type from its content: a text answer can never be run as a script.
add_header X-Content-Type-Options nosniff always;
# No other site may show this page inside a frame (stops "click-jacking": a hidden PaySwitch under
# a fake button). frame-ancestors below says the same to newer browsers.
add_header X-Frame-Options DENY always;
# Tell other sites nothing about the page a visitor came from.
add_header Referrer-Policy same-origin always;
# This page never needs the camera, microphone, location or the browser's payment sheet.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Only our own files may run or load. No inline scripts or styles, no other origins: if someone ever
# got HTML into the page (a crafted VPA, say), the browser would still refuse to run it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
