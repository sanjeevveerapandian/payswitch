# The gateway: the ONLY door into PaySwitch from outside Docker.
#
#   /                      the demo UI (static files from web/html)
#   /api/psp/...           -> psp:8080/...
#   /api/switch/...        -> switch:8083/...       (/api/switch/events/... is the live SSE stream)
#   /api/banka|bankb|bankc -> bank-a:8081, bank-b:8082, bank-c:8084
#   /grafana/              -> grafana:3000/grafana/
#
# Included inside nginx's http { } block (that is where files in conf.d/ go).

# Bank name in the URL -> container and port.
map $bank $bank_upstream {
    banka bank-a:8081;
    bankb bank-b:8082;
    bankc bank-c:8084;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's own DNS. Upstreams are named in variables, so nginx looks them up per request:
    # it starts even if a service is still booting, and it finds the switch again after the
    # switch-crash scenario restarts it.
    resolver 127.0.0.11 valid=5s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        try_files $uri $uri/ /index.html;
        # The UI changes with the code: let browsers keep a copy, but check it (ETag) every time.
        # (add_header here replaces the server-level ones, so they are repeated.)
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # ---- the live stream: Server-Sent Events ---------------------------------------------------
    # nginx normally BUFFERS a response (collects the upstream's bytes in memory, or a temp file,
    # before passing them on). That suits a page; a stream that never ends wants every event
    # passed on at once. nginx's advice for streaming is to switch buffering off, so: no
    # buffering, no caching, no gzip (gzip waits to fill its own buffer), and a read timeout far
    # longer than the 15 s heartbeat, so an idle but healthy stream is never cut. (In our own
    # test nginx 1.27 still passed small events promptly with buffering on; off is the safe,
    # documented setting, not something we could make fail.)
    location /api/switch/events/ {
        set $switch_host switch;
        rewrite ^/api/switch/(.*)$ /$1 break;
        proxy_pass http://$switch_host:8083;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location /api/switch/ {
        set $switch_host switch;
        rewrite ^/api/switch/(.*)$ /$1 break;
        proxy_pass http://$switch_host:8083;
        # The credit-unknown-deemed scenario waits for status checks: up to ~40 s.
        proxy_read_timeout 60s;
    }

    location /api/psp/ {
        set $psp_host psp;
        rewrite ^/api/psp/(.*)$ /$1 break;
        proxy_pass http://$psp_host:8080;
    }

    location ~ ^/api/(?<bank>bank[abc])/ {
        rewrite ^/api/bank[abc]/(.*)$ /$1 break;
        proxy_pass http://$bank_upstream;
    }

    location /grafana/ {
        set $grafana_host grafana;
        proxy_pass http://$grafana_host:3000;
        # Grafana Live uses a WebSocket. (Setting any header here replaces ALL the server-level
        # proxy_set_header lines for this location, so Host is repeated.)
        proxy_set_header Host       $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
