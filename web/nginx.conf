# The gateway: the ONLY door into PaySwitch from outside Docker.
#
#   PUBLIC (anyone, rate limited)                 ADMIN (HTTP basic auth; ADMIN_USER / ADMIN_PASSWORD in .env)
#   /                          the demo UI         /api/admin/login            the UI's "Admin log in" check
#   POST /api/psp/pay          10/min per IP       /api/admin/psp/...          -> psp:8080/...
#   GET  /api/psp/pay/{txnId}                      /api/admin/switch/...       -> switch:8083/...
#   GET  /api/switch/events/txns   live SSE        /api/admin/banka|bankb|bankc/... -> each bank
#   GET  /api/switch/txns/{txnId}  one history     /grafana/                   -> grafana:3000
#   GET  /api/switch/admin/money-summary  TOTAL
#   POST /api/switch/admin/scenario/{one of the five}
#
# Everything else under /api/ is 404. That matters: a bank's own /credit endpoint, the switch's
# /pay (which skips the PSP's checks), recon, settlement and the chaos settings are never public.
#
# This file is included inside nginx's http { } block (that is where conf.d/ files go), so the
# zones and maps below are http-level, and the server { } is the one site.

server_tokens off;                       # error pages do not advertise the nginx version

# ---- Who is the client? -----------------------------------------------------------------------
# In production Caddy (HTTPS) sits in front, so every connection arrives FROM Caddy. Caddy puts the
# real address in X-Forwarded-For. Believe that header only when the connection itself comes from
# a private address (Caddy on this machine, or another container); a stranger on the internet
# cannot fake it, because their own connection comes from a public address.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ---- Rate limits (counted per client address) ------------------------------------------------
# rate=10r/m means one request every 6 s on average; "burst" lets a few extra through at once.
# A zone of 10m holds about 160,000 addresses.
limit_req_zone $binary_remote_addr zone=pay:10m      rate=10r/m;   # POST /pay
limit_req_zone $binary_remote_addr zone=scenario:10m rate=4r/m;    # scenario buttons
limit_req_zone $binary_remote_addr zone=reads:10m    rate=10r/s;   # UI files, TOTAL polling, histories
limit_req_zone $binary_remote_addr zone=admin:10m    rate=10r/s;   # everything behind the password
limit_req_zone $binary_remote_addr zone=login:10m    rate=10r/m;   # password guesses on the login check
# The crash scenario restarts the switch for EVERYONE, so it is limited globally, not per address:
# the key is the same word for every request (and empty, meaning "not counted", for other URLs).
map $uri $crash_key {
    ~/switch-crash$ all;
    default         "";
}
limit_req_zone $crash_key zone=crash:1m rate=1r/m;
# How many live streams one address may hold open (a browser tab holds one).
limit_conn_zone $binary_remote_addr zone=streams:10m;
limit_req_status  429;                   # "Too Many Requests", not the default 503 "server broken"
limit_conn_status 429;

# Bank name in an admin URL -> container and port.
map $admin_service $admin_upstream {
    psp    psp:8080;
    switch switch:8083;
    banka  bank-a:8081;
    bankb  bank-b:8082;
    bankc  bank-c:8084;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's own DNS. Upstreams are named in variables, so nginx looks them up per request:
    # it starts even if a service is still booting, and it finds the switch again after the
    # switch-crash scenario restarts it (with a new IP address).
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ---- Size and time limits: a slow or huge request cannot tie up the gateway ---------------
    client_max_body_size     16k;        # the biggest real body (chaos settings) is ~200 bytes
    client_body_buffer_size  16k;
    large_client_header_buffers 4 8k;
    client_header_timeout    10s;        # a client that sends its request this slowly is dropped
    client_body_timeout      10s;
    send_timeout             30s;
    keepalive_timeout        30s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;           # the PSP waits up to 20 s for the switch

    gzip on;
    gzip_types text/css application/javascript application/json;

    # nginx's trap: add_header in a location REPLACES every add_header from the server level.
    # So the headers live in one file, included here and again in each location that adds its own.
    include /etc/nginx/snippets/security-headers.conf;

    # Our own JSON for "slow down", in the same problem format the services use.
    error_page 429 = @too_many;
    location @too_many {
        default_type application/problem+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After 10 always;
        return 429 '{"status":429,"title":"Too Many Requests","detail":"Too many requests from your address. Please wait a few seconds and try again."}';
    }

    # Docker's health check. Says "nginx is up", nothing about the services behind it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- The UI ---------------------------------------------------------------------------------
    location / {
        limit_req zone=reads burst=40 nodelay;
        try_files $uri $uri/ /index.html;
        # The UI changes with the code: let browsers keep a copy, but check it (ETag) every time.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---- PUBLIC API: an allow-list, method by method --------------------------------------------
    location = /api/psp/pay {
        limit_except POST { deny all; }
        limit_req zone=pay burst=5 nodelay;      # 6 payments at once, then one every 6 s
        set $psp_host psp;
        rewrite ^/api/psp/(.*)$ /$1 break;
        proxy_pass http://$psp_host:8080;
    }

    location ~ ^/api/psp/pay/[A-Za-z0-9_-]+$ {
        limit_except GET { deny all; }
        limit_req zone=reads burst=20 nodelay;
        set $psp_host psp;
        rewrite ^/api/psp/(.*)$ /$1 break;
        proxy_pass http://$psp_host:8080;
    }

    location ~ ^/api/switch/txns/[A-Za-z0-9_-]+$ {
        limit_except GET { deny all; }
        limit_req zone=reads burst=20 nodelay;
        set $switch_host switch;
        rewrite ^/api/switch/(.*)$ /$1 break;
        proxy_pass http://$switch_host:8083;
    }

    location = /api/switch/admin/money-summary {
        limit_except GET { deny all; }
        limit_req zone=reads burst=20 nodelay;
        set $switch_host switch;
        rewrite ^/api/switch/(.*)$ /$1 break;
        proxy_pass http://$switch_host:8083;
    }

    # The five scenarios, by name. One at a time is enforced by the switch itself (429 "busy").
    location ~ ^/api/switch/admin/scenario/(happy|insufficient-funds|debit-reply-lost|credit-unknown-deemed|switch-crash)$ {
        limit_except POST { deny all; }
        limit_req zone=scenario burst=2 nodelay;
        limit_req zone=crash;                    # only counts the switch-crash URL; once a minute for all
        set $switch_host switch;
        rewrite ^/api/switch/(.*)$ /$1 break;
        proxy_pass http://$switch_host:8083;
        proxy_read_timeout 60s;                  # credit-unknown-deemed waits for status checks (~15-40 s)
    }

    # ---- The live stream: Server-Sent Events ----------------------------------------------------
    # nginx normally BUFFERS a response (collects the upstream's bytes before passing them on). That
    # suits a page; a stream that never ends wants every event passed on at once. nginx's advice for
    # streaming is to switch buffering off, so: no buffering, no caching, no gzip (gzip waits to fill
    # its own buffer), and a read timeout far longer than the 15 s heartbeat, so an idle but healthy
    # stream is never cut. (In our own test nginx 1.27 still passed small events promptly with
    # buffering on; off is the safe, documented setting, not something we could make fail.)
    location = /api/switch/events/txns {
        limit_except GET { deny all; }
        limit_conn streams 4;                    # 4 open tabs per address; the switch caps all at 100
        set $switch_host switch;
        rewrite ^/api/switch/(.*)$ /$1 break;
        proxy_pass http://$switch_host:8083;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    # Anything else under /api/ that is not admin: not public.
    location /api/ {
        default_type application/problem+json;
        return 404 '{"status":404,"title":"Not Found","detail":"Not a public route. Admin routes are under /api/admin/ and need the admin password."}';
    }

    # ---- ADMIN: everything behind one password --------------------------------------------------
    # One prefix on purpose: after the browser's login box has been answered once for
    # /api/admin/login, the browser sends the password by itself to every URL under /api/admin/.
    location ^~ /api/admin/ {
        auth_basic           "PaySwitch admin";
        auth_basic_user_file /etc/nginx/admin.htpasswd;     # written at start-up from .env
        limit_req zone=admin burst=40 nodelay;

        # 200 only once the password was right. (A "return" would answer BEFORE the password is
        # checked: return runs in nginx's rewrite phase, auth_basic in the later access phase. A
        # file is served in the content phase, after it.)
        location = /api/admin/login {
            limit_req zone=login burst=5 nodelay;
            default_type application/json;
            alias /usr/share/nginx/admin/ok.json;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # /api/admin/switch/admin/recon/run -> switch:8083/admin/recon/run, and so on.
        location ~ ^/api/admin/(?<admin_service>psp|switch|banka|bankb|bankc)/ {
            rewrite ^/api/admin/[a-z]+/(.*)$ /$1 break;
            proxy_pass http://$admin_upstream;
            proxy_read_timeout 120s;             # recon over many payments takes a while
        }

        default_type application/problem+json;
        return 404 '{"status":404,"title":"Not Found","detail":"Unknown admin service."}';
    }

    location /grafana/ {
        auth_basic           "PaySwitch admin";
        auth_basic_user_file /etc/nginx/admin.htpasswd;
        limit_req zone=admin burst=100 nodelay;  # a dashboard loads many panels at once
        set $grafana_host grafana;
        proxy_pass http://$grafana_host:3000;
        # Setting any header here replaces ALL the server-level proxy_set_header lines, so the
        # usual ones are repeated. Grafana Live uses a WebSocket (Upgrade).
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;
        # Our admin password must not reach Grafana: it would try it as a GRAFANA login and refuse.
        proxy_set_header Authorization     "";
        # Grafana's pages need inline scripts, so our strict Content-Security-Policy is not sent here.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
