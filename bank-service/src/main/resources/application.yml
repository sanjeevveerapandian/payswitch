# One app, three banks: start it with BANK_CODE=BANKA, BANKB or BANKC.
bank:
  code: ${BANK_CODE:BANKA}
  chaos:
    # Only used with the "chaos" profile. A dropped response stays silent this long, which
    # must be longer than the switch's read timeout (5s) so the switch gives up first.
    drop-response-sleep: 8s
    # Phase 13: switch all chaos off again this long after the last change (0 = never).
    # The demo stack sets 5m (docker-compose.yml) so one visitor's chaos cannot spoil the demo.
    auto-reset-after: ${BANK_CHAOS_AUTO_RESET_AFTER:0s}

server:
  port: ${PORT:8081}

spring:
  application:
    name: bank-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/banka}
    username: ${DB_USER:payswitch}
    password: ${DB_PASSWORD:payswitch}
  flyway:
    # Shared schema for every bank, plus seed customers for THIS bank only.
    locations: classpath:db/bank/migration,classpath:db/bank/seed/${bank.code}
  jackson:
    deserialization:
      # Amounts are whole paise. By default Jackson turns 20000.9 into 20000 without a word.
      # Off: a decimal amount is a 400, never a quietly different amount of money.
      accept-float-as-int: false
  web:
    resources:
      # The bank serves no static files. Without this, a POST to an unknown URL (like
      # /admin/chaos when chaos is off) would answer 405 instead of a clear 404.
      add-mappings: false

# Phase 11: metrics for Prometheus, and one JSON object per log line.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus     # GET /actuator/prometheus: every metric, in Prometheus' text format
  metrics:
    tags:
      application: ${spring.application.name}   # on every metric, so dashboards can tell services apart
      bank: ${bank.code}                          # which of the three banks this instance is

logging:
  structured:
    format:
      # Built into Spring Boot 3.4+: no extra library. Every line becomes one JSON object with
      # @timestamp, level, logger_name, message, and every MDC key (txnId, state) as its own field.
      console: logstash
    json:
      add:
        service: bank-service-${bank.code}
