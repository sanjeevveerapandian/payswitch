# Local databases only. Each bank gets its own Postgres, like two real banks would.
#   Bank A -> localhost:5433/banka
#   Bank B -> localhost:5434/bankb
services:
  postgres-banka:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banka
      POSTGRES_USER: payswitch
      POSTGRES_PASSWORD: payswitch
    ports:
      - "5433:5432"

  postgres-bankb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankb
      POSTGRES_USER: payswitch
      POSTGRES_PASSWORD: payswitch
    ports:
      - "5434:5432"
